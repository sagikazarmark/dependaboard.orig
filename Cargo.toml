[workspace]
resolver = "2"
members = [
  "apps/restate-service",
  "apps/web",
  "crates/core",
  "crates/github",
  "crates/store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.99"
async-trait = "0.1.89"
axum = "0.8.4"
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
dioxus = { version = "0.7.10", features = ["fullstack"] }
# Pinned to the revision the dioxus-daisyui-components registry installs against.
# The default `router` feature is off: the app has no routes — the dashboard
# drives the browser history directly (apps/web/src/ui/url_sync.rs) — and it is
# the only thing that pulls dioxus-router into the browser bundle.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false }
http = "1.3.1"
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"] }
libsql = { version = "0.9.30", default-features = false, features = ["core", "remote", "tls"] }
octoevents = { version = "0.2.0", default-features = false, features = ["derive", "tracing"] }
regex = "1.11.2"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
restate-sdk = "0.11.1"
secrecy = { version = "0.10.3", features = ["serde"] }
semver = "1.0.26"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
serde_norway = "0.9.42"
subtle = { version = "2.6.1", default-features = false }
thiserror = "2.0.16"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.20.0", features = ["js", "serde", "v7"] }
web-time = "1.1.0"

[profile.release]
lto = "thin"
strip = true

# The dev profile compiles dependencies at -O0, and a few of them do the kind
# of work the tests feel at that level: `rsa` and `num-bigint-dig` sign the
# RS256 JWT behind every GitHub token exchange, one per client test, and
# `libsql-ffi` is SQLite itself, under every store test and every server test
# with a read model. `aws-lc-sys` and `ring` are the crypto under the two TLS
# stacks (reqwest's rustls and libsql's); the tests speak plain HTTP to
# loopback and hardly touch them, but they are the rest of the crypto tier
# and go with it. None is code we debug, so optimising them costs one longer
# build of each and nothing in the debuggability of our own crates.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.libsql-ffi]
opt-level = 3

[profile.dev.package.aws-lc-sys]
opt-level = 3

[profile.dev.package.ring]
opt-level = 3
