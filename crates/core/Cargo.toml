[package]
name = "dependaboard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Parsing Dependabot's commit metadata pulls in regex, semver and a YAML
# parser. Only the GitHub sync path needs it; the browser bundle leaves it out.
dependabot-metadata = ["dep:regex", "dep:semver", "dep:serde_norway"]

[dependencies]
base64.workspace = true
regex = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_norway = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true
web-time.workspace = true
