name: dependaboard

services:
  restate:
    image: docker.restate.dev/restatedev/restate:1.7.6
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9070:9070"
      - "127.0.0.1:9071:9071"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - restate-data:/restate-data
    restart: unless-stopped

volumes:
  restate-data:
